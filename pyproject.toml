[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-fraud-triage"
version = "0.1.0"
description = "Evidence-gated tool-calling fraud investigations with reproducible evaluation"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3", "numpy>=1.26,<3", "scikit-learn>=1.5,<2",
  "pydantic>=2.10,<3", "langchain-core>=1,<2", "langchain-huggingface>=1,<2",
  "huggingface-hub>=0.33,<2",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
[project.scripts]
fraud-triage = "fraud_triage.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
